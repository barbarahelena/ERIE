[workspace]
authors = ["Barbara Verhaar <bjh.verhaar@gmail.com>"]
channels = ["conda-forge"]
name = "ERIE"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
01-clean-data = "Rscript scripts/01_clean_data.R"
02-fit-shared-kel = "Rscript scripts/02_fit_shared_kel.R"
03-diet-summary-shared-kel = { cmd = "Rscript scripts/03_diet_summary_shared_kel.R", depends-on = ["02-fit-shared-kel"] }
sim-01-ka-kel-recovery = { cmd = "Rscript scripts/simulations/01_ka_kel_recovery.R", depends-on = ["02-fit-shared-kel"] }
sim-02-shared-kel = { cmd = "Rscript scripts/simulations/02_shared_kel.R", depends-on = ["02-fit-shared-kel"] }
sim-03-plot = "Rscript scripts/simulations/03_plot.R"
sim-04-structure-selection = { cmd = "Rscript scripts/simulations/04_structure_selection.R", depends-on = ["02-fit-shared-kel"] }
sim-05-plot-structure-examples = { cmd = "Rscript scripts/simulations/05_plot_structure_examples.R", depends-on = ["02-fit-shared-kel"] }
04-fit-13C6 = { cmd = "Rscript scripts/04_fit_13C6.R", depends-on = ["02-fit-shared-kel"] }
05-diet-summary-13C6 = { cmd = "Rscript scripts/05_diet_summary_13C6.R", depends-on = ["04-fit-13C6"] }
pipeline = { depends-on = ["01-clean-data", "03-diet-summary-shared-kel"] }
test-engine = "Rscript scripts/assets/tests.R"

[dependencies]
r-base = ">=4.5.3,<4.6"
r-tidyverse = ">=2.0.0,<3"
r-readxl = ">=1.5.0,<2"
r-desolve = ">=1.42,<2"
r-ggthemes = ">=6.0.0,<7"
r-ggpubr = ">=1.0.0,<2"
