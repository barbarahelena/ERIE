[workspace]
authors = ["Barbara Verhaar <bjh.verhaar@gmail.com>"]
channels = ["conda-forge"]
name = "ERIE"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
clean-data = "Rscript scripts/01_clean_data.R"
fit-model = "Rscript scripts/02_fit_erie_model.R"
diet-summary = "Rscript scripts/03_diet_summary.R"
pipeline = { depends-on = ["clean-data", "fit-model", "diet-summary"] }
test-engine = "Rscript scripts/assets/tests.R"
compare-former = "Rscript scripts/04_compare_to_former_model.R"

[dependencies]
r-base = ">=4.5.3,<4.6"
r-tidyverse = ">=2.0.0,<3"
r-readxl = ">=1.5.0,<2"
r-desolve = ">=1.42,<2"
r-ggthemes = ">=6.0.0,<7"
r-lme4 = ">=2.0_6,<3"
r-lmertest = ">=3.2_1,<4"
r-ggpubr = ">=1.0.0,<2"
